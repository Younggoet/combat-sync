[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Pulls RSS feeds, persists new articles, and name-matches them against
# the fighters table — see netlify/functions/news-sync.js. get-news.js
# just reads what this leaves in Supabase; it no longer fetches live.
[functions."news-sync"]
  schedule = "*/30 * * * *"

# Polls Cito for bouts seed-live-card.js has marked 'scheduled'/'live'
# (today's date only) and upserts current mma_stats — see
# netlify/functions/live-poll.js. Every minute is the finest grain
# Netlify scheduled functions support; harmless/cheap on days with no
# live or upcoming-today bouts since the query returns nothing to do.
[functions."live-poll"]
  schedule = "* * * * *"
