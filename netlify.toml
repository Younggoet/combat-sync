[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Pulls RSS feeds, persists new articles, and name-matches them against
# the fighters table — see netlify/functions/news-sync.js. get-news.js
# just reads what this leaves in Supabase; it no longer fetches live.
[functions."news-sync"]
  schedule = "*/30 * * * *"

# Autopicks for whichever team's clock has run out in a real, active
# draft room — see netlify/functions/autopick-check.js. Runs every
# minute, so a pick timer can run up to ~60s past pick_seconds before
# the bot pick actually lands.
[functions."autopick-check"]
  schedule = "* * * * *"
